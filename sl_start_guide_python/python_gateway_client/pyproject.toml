[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dfba-gateway-client"
version = "0.1.0"
description = "Standalone strongly typed Python client for the DFBA gateway"
requires-python = ">=3.12"
dependencies = [
  "base58==2.1.1",
  "PyNaCl==1.6.2",
  "sortedcontainers==2.4.0",
  "websockets==16.0",
  "textual==8.2.6",
]

[project.optional-dependencies]
dev = [
  "build==1.5.0",
  "mypy==2.1.0",
  "ruff==0.15.13",
]

[project.scripts]
sl-tui = "dfba_client.tui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dfba_client*"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["base58", "sortedcontainers", "websockets.*", "textual.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
